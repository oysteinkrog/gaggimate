; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
; Pinned to 55.03.31-2 (Arduino 3.3.1 / IDF 5.5.1 + backports). IDF 5.5.2+
; (pioarduino 55.03.32 onward) ships a precompiled libbtdm_app.a whose
; btdm_controller_init -> r_llm_env_init overflows its internal allocations
; on ESP32-S3 rev v0.2, corrupting TLSF metadata and crashing NimBLE bring-up.
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.31-2
framework = arduino, espidf
monitor_speed = 115200
lib_ldf_mode = deep+
build_unflags =
	-std=gnu++11
	-std=gnu++17
	-std=gnu++2b
# check_skip_packages is what makes the display check mean anything.
#
# PlatformIO 6.1.19 pins cppcheck 2.11 (July 2023), and the registry has no
# newer build: tool-cppcheck 1.21100.241030 is the same 2.11 rebuilt. That
# parser cannot read GCC 14.2's libstdc++. Three separate constructs kill it,
# and fixing one only uncovers the next:
#
#   <type_traits>:788  `__extension__ template<...> using ...`   (-D__extension__= works)
#   <array>:73         `__attribute__((__noreturn__))` on a member function
#                      with a return type                        (-D__attribute__(x)= works)
#   <compare>:1228     `requires requires { { a < b } -> C; }`   (no workaround; 2.11
#                      does not implement C++20 requires-expressions)
#
# A syntax error inside PlatformIO's packages directory is a breaking defect:
# PlatformIO sets _bad_input, drops the defect from the report, and exits 1
# whatever the findings were. That is why the CI step was pinned to
# continue-on-error, and it had nothing to do with this project's code.
#
# Skipping the package include dirs means cppcheck never opens those headers.
# It analyses strictly more of our code that way, not less: a translation unit
# that dies in <compare> is abandoned whole, so a full display run over
# src/display reported four low findings and five syntax errors. With packages
# skipped, src/display/core alone reports 197. cppcheck is explicit that it
# does not need standard library headers for correct results.
#
# The suppressions are all structural, not judgement calls:
#   missingInclude*     the direct, intended consequence of skipping packages
#   unusedFunction      PlatformIO invokes cppcheck one file at a time, so no
#                       cross-file caller is ever visible and every non-static
#                       function outside its own file looks dead
#   unmatchedSuppression  the .pio suppression below matches nothing (src_filters
#                       never let a .pio file into the file list), so it emitted
#                       one information line per source file
check_skip_packages = yes
check_flags =
	cppcheck: --enable=all --inline-suppr --suppress=*:*/.pio/* --suppress=missingInclude --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=unmatchedSuppression
monitor_filters =
	esp32_exception_decoder
	time
	default

[display_common]
build_flags =
	-std=gnu++20
	-DLV_CONF_INCLUDE_SIMPLE
	-DLV_CONF_PATH="${platformio.src_dir}/display/lv_conf.h"
	-DDISABLE_ALL_LIBRARY_WARNINGS
	-DLV_CONF_SUPPRESS_DEFINE_CHECK
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=3
	-DCONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_CMN
	; -O2, not upstream's -Os. The animation pipeline is the hot path and the
	; target is 40+ fps on the panel; the flash this costs is affordable at
	; 16 MB and the speed is not recoverable any other way.
	;
	; This only takes effect together with the -Os entry in build_unflags below.
	; The dual-framework build appends its own -Os AFTER build_flags (verified in
	; a verbose build: -Os at argument 61, our -O2 at 93, another -Os at 114), and
	; GCC honours the last -O it is given, so on its own this line is inert and
	; silently so. Do not remove one without the other.
	-O2
	-DCONFIG_MAX_FILENAME_LEN=64
	-DCONFIG_MAX_URL_LEN=128
	-DCONFIG_BT_NIMBLE_PINNED_TO_CORE=0
	; Run AsyncTCP on core 0, same core as the WiFi MAC and LWIP tcpip thread.
	; Driving LWIP from a different core than the WiFi/RX path (core 1) risks
	; cross-core LWIP races under load that wedge the whole IP stack (web + ICMP
	; die together). v1.8.1 used core 0 and was stable; the BLE load that
	; originally motivated moving it off core 0 is now much lower (idle 30-50ms
	; connection interval + fire-and-forget telemetry).
	-DCONFIG_ASYNC_TCP_RUNNING_CORE=0
	-DCONFIG_ASYNC_TCP_MAX_ACK_TIME=5000
	-DCONFIG_ASYNC_TCP_PRIORITY=10
	-DCONFIG_ASYNC_TCP_QUEUE_SIZE=64
	-DCONFIG_ASYNC_TCP_STACK_SIZE=8192
	-DDEFAULT_MAX_WS_CLIENTS=3
lib_deps_default =
	FS
	SPIFFS
	; LittleFS, not SPIFFS, is what actually gets mounted: SPIFFS has no
	; directory tree, so a stat() miss scans the whole filesystem, and the web
	; handler does that synchronously per request.
	LittleFS
	Wire
	SPI
	; Arduino 3.x split these out of the monolithic core, so they have to be
	; named explicitly now.
	Networking
	NetworkClientSecure
	WiFi
	HTTPClient
	HTTPUpdate
	Update
	ble_ota_dfu
	NanoPbComm
	OTA
	nanopb/Nanopb@^0.4.9
	https://github.com/ESP32Async/AsyncTCP.git#v3.4.10
	; Fork of ESP32Async/ESPAsyncWebServer at v3.10.3. The only change is that
	; the 2,872-byte response send buffer comes from PSRAM and is held for the
	; life of the response instead of being reallocated every send round.
	; Upstream's plain operator new obeys CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL,
	; so it can only ever come from internal DRAM, and when it fails the
	; response stalls silently. Measured here: four concurrent connections
	; drove the largest free internal block to 2,804 B and transfers stopped.
	; (#psram-send-buffer is the same patch on v3.9.1, for the Arduino 2.0.17 branch.)
	; Pinned to a commit, not the branch: a branch ref is mutable, so a force-push
	; there would silently change what a release build links against. Bump this
	; SHA deliberately. Branch: psram-send-buffer-v3.10.3
	https://github.com/oysteinkrog/ESPAsyncWebServer.git#1dc278b9a7915b7d97baa79e0a5449b2eb72b8d4
	bblanchon/ArduinoJson@^7.2.1
	256dpi/MQTT@^2.5.2
	https://github.com/gaggimate/esp-arduino-ble-scales.git#v2.0.0
	homespan/HomeSpan@^2.1.7
	jnthas/Improv WiFi Library@^0.0.4
	; ESPToolKit/esp-memoryMonitor v1.0.1 is vendored into lib/ESPMemoryMonitor
	; rather than fetched, because it needed a patch this board cannot do
	; without: its sample walked every heap block, which on the shared MSPI bus
	; starved the RGB panel's bounce refill and put a displaced band on screen
	; once per sample. See enableHeapWalk in that library's config header.

; Shared IDF / dual-framework keys referenced by the display and controller
; envs (the env-section equivalent of [display_common]). nanopb generates
; gaggimate.pb.{c,h} from the .proto at build time; the component_remove list
; strips managed components we never use to cut first-build time + flash.
[idf_common]
extra_scripts =
	pre:scripts/patch_esp_lcd_rgb.py
	pre:scripts/patch_flash_cache_flag.py
	pre:scripts/patch_phy_track_defer.py
	pre:scripts/patch_ble_scan_duty.py
	; lv_meter invalidates the whole 500x500 dial on every scale-lines value
	; change; on these screens that is a full-screen redraw per telemetry
	; tick (~650 ms LVGL pass, ~750 ms touch latency measured). The patch
	; invalidates only the changed tick-ring sector.
	pre:scripts/patch_lvgl_meter_inv.py
	; The overlay snapshot renders through LVGL's generic TRUE_COLOR_ALPHA
	; set_px_cb, a function-pointer call per pixel. Inline it (identical
	; bytes, ~1/3 off the pixel-blend substage in QEMU attribution).
	pre:scripts/patch_lvgl_setpx_fast.py
	pre:scripts/auto_firmware_version.py
	pre:scripts/pioarduino_env.py
	post:scripts/assert_sdkconfig.py
custom_nanopb_protos =
	+<lib/NanoPbComm/proto/gaggimate.proto>
custom_nanopb_options =
	--error-on-unmatched
lib_ignore =
	ESP_SR
custom_component_remove =
	chmorgan/esp-libhelix-mp3
	espressif/cbor
	espressif/esp-dsp
	espressif/esp-modbus
	espressif/esp-sr
	espressif/esp-zboss-lib
	espressif/esp-zigbee-lib
	espressif/esp_diag_data_store
	espressif/esp_diagnostics
	espressif/esp_insights
	espressif/esp_modem
	espressif/esp_rainmaker
	espressif/qrcode
	espressif/rmaker_common
	espressif/lan867x

[env:display]
board = LilyGo-T-RGB
upload_speed = 921600
; Strips both -Os occurrences (the framework's and the one appended after
; build_flags), leaving our -O2 as the last -O on the command line. The -std
; entries are repeated from [env] because an env-level build_unflags replaces
; the parent value rather than extending it.
build_unflags =
	-std=gnu++11
	-std=gnu++17
	-std=gnu++2b
	-Os
board_build.filesystem = littlefs
board_build.partitions = partitions/default_16mb.csv
board_build.cmake_extra_args = -DEXECUTABLE_COMPONENT_NAME=src -DSDKCONFIG_DEFAULTS=sdkconfig.common.defaults;sdkconfig.gaggimate.defaults
; webassets/web_ui_blob.S is assembled explicitly by embed_webui_pre.py rather
; than collected here. The dual arduino+espidf build does not pick .S files out
; of src/, so leaving it to the scan silently drops the embedded web UI blob and
; only fails at link once the manifest is non-empty.
build_src_filter = -<*> +<display/> +<version.h> -<display/webassets/>
custom_nanopb_protos = ${idf_common.custom_nanopb_protos}
custom_nanopb_options = ${idf_common.custom_nanopb_options}
lib_ignore = ${idf_common.lib_ignore}
custom_component_remove = ${idf_common.custom_component_remove}
extra_scripts =
	${idf_common.extra_scripts}
	; Ensures src/display/webassets/* (embedded web UI) exists before compile;
	; stubs an empty bundle if build_webui.sh hasn't been run. [GM-106]
	pre:scripts/embed_webui_pre.py
lib_deps =
	${display_common.lib_deps_default}
	lewisxhe/SensorLib @ 0.2.3
	bodmer/TFT_eSPI @ 2.5.43
	lvgl/lvgl @ 8.4.0
	moononournation/GFX Library for Arduino @ ^1.6.5
build_flags =
	${display_common.build_flags}
	; --- LCD overdrive (T-RGB / ST7701S) ---
	; 12 MHz pclk + tightened porches: 518x508 total timing -> ~46 Hz refresh
	; (vs stock 7 MHz / 561x531 -> 23.5 Hz). 12 MHz + these porches is a proven
	; ESPHome production config on the same ST7701S 480x480 panel family;
	; Espressif's documented ceiling for octal PSRAM @80 MHz is ~22 MHz.
	; Failure signatures if a specific unit can't hold it: horizontal drift =
	; PSRAM bandwidth starvation, snow/wrong colors = signal integrity.
	; 16 MHz (~60 Hz) scanned out clean on a static standby screen but tears/
	; garbles under heavy LVGL redraws (brew screens): scan-out at 32 MB/s
	; plus full-screen composite traffic exceeds this unit's PSRAM budget.
	; CAVEAT (discovered sleep16): the IDF 4.4 RGB driver floors the requested
	; pclk onto an integer-divider grid off 80 MHz (PLL160M/2), so only
	; 80/n MHz are real: n=5 -> 16.0 MHz (~61 Hz), n=6 -> 13.33 (~51 Hz),
	; n=7 -> 11.43 (~43 Hz). The earlier "12 MHz" builds actually ran 13.33;
	; this "14 MHz" value actually runs 16.0 -- identical to the 16 MHz config
	; above. The divider is now a live web setting (panelClockDiv, see
	; PanelClock.h); this flag only sets the boot value.
	; The grid did survive IDF 5.5, and the measured frame rates identify the
	; divider directly: the old 14000000UL value ran n=5 and counted 53.4 fps,
	; the value below runs n=7 and counts 43.4 fps.
	;
	; n=7 rather than n=5 because n=5 does not survive a live BLE connection.
	; Measured on the linktest rig, animation running, holding a real link to
	; the same peer in both runs:
	;   n=5 (16.0 MHz): 272 slips / 9612 frames = 2.83%
	;   n=7 (11.4 MHz):   0 slips / 6976 frames = 0.00%
	; Merely scanning hides this -- n=5 scanned out 0 slips / 2213 frames -- so
	; every earlier measurement that liked the faster clock was taken without a
	; connection. A slip is a real scan-out underrun, seen on the panel as a
	; band of displaced pixels, and 2.83% of frames is the garbling reported
	; from the machine. The refill deadline scales with the line time, so the
	; slower clock is not a workaround for it: it is the budget the refill
	; needs once a connection is competing for the bus and the CPU. Ten fps is
	; the price, and this panel showed no flicker at n=7.
	; n=8 (10.0 MHz, 38.0 fps) was measured too, once WiFi was identified as the
	; jitter source, on the theory that a longer line time buys back the
	; tolerance that eight bounce lines gives up. It helps and does not solve:
	; at 8 bounce lines, 2 slips / 21,672 frames (0.0092%) against 4.7 expected
	; at the n=7 rate. Halving the rate is not worth 12% of the refresh when the
	; result is still not clean, so n=7 stood, with a note to revisit only if
	; the WiFi jitter itself was ever fixed, at which point the clock should go
	; up, not down.
	;
	; That condition was met: the jitter was never bus contention but the BLE
	; link-layer ISR preempting the bounce-refill EOF interrupt on core 0
	; (see the panel-init pinning in Controller::setupPanel). With the panel's
	; interrupts on core 1 the radio cannot delay the refill at all, and n=6
	; (13.3 MHz, 50.7 fps) measured 0 resyncs over a 304 s loadtest window
	; with WiFi churn, BLE scanning and flash writes live; residual latency
	; events reach catch-up depth 5 of 8 buffers, absorbed invisibly. n=5 is
	; still out: its 453 us of pool slack is under the 638 us worst stall
	; observed at n=6, so rare visible bands would return.
	; Fallback: drop to 11430000UL (n=7, the last radio-preemption-era value)
	; or 8000000UL (LilyGo's current upstream default), and/or remove the
	; porch overrides.
	-DRGB_MAX_PIXEL_CLOCK_HZ=13333333UL
	; Eight scanlines of bounce buffer, 15360 bytes of internal DRAM for the
	; pair. This is what makes the clock above survivable: without it the
	; scan-out DMA reads PSRAM in real time and loses the race against the
	; render task. See the comment on the panel config in LilyGo_RGBPanel.cpp,
	; and CONFIG_ESP32S3_DATA_CACHE_LINE_64B, which is the other half of the fix.
	;
	; Eight and not five because five was still losing occasionally. What
	; refills the bounce buffer is a CPU memcpy out of PSRAM, and the animation
	; pushes its bands into PSRAM over GDMA; both cross the same MSPI. Every
	; underrun logged under a screen-change stress had a band push within 600 us
	; of it. The refill's work grows with the buffer but so does its deadline,
	; so what actually changes is the absolute slack: a scanline is 32.4 us, so
	; the deadline goes from 162 us to 259 us while the memcpy stays around half
	; of it, roughly 80 us of tolerance to a transient stall becoming 130.
	;
	; Now twelve, at 23040 bytes for the pair. Both halves of that changed:
	; what the buffer has to survive, and what it competes with.
	;
	; Ten was rejected once for driving the internal-DRAM low-water mark to
	; 2.6 kB. That was true while the background animation took 17.3 kB of
	; internal DRAM before WiFi and BLE had claimed theirs, which it no longer
	; does (see radiosSettled in BgAnimCommon.cpp), and while
	; CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL was 4096 rather than 1024.
	;
	; The deadline matters more than it used to, because moving the animation's
	; band buffers to PSRAM doubled its MSPI traffic: every push now reads PSRAM
	; as well as writing it, and the refill loses that race more often. Measured
	; on the display-blestress rig with BLE up and the animation running, slips
	; per frame:
	;
	;    8 lines  (259 us deadline)   48 / 1914   2.51%
	;   10 lines  (324 us deadline)    9 / 1692   0.53%
	;   12 lines  (389 us deadline)    4 / 1711   0.23%
	;
	; Back to eight, and this time the reason is the web server rather than the
	; panel. The DMA-capable pool is not just the bounce buffers' home, it is
	; also where the WiFi MAC gets the buffer it copies every outgoing packet
	; into (see the cache TX note in sdkconfig.gaggimate.defaults). Starve it
	; and TCP segments are dropped, connections retransmit-stall, and the web UI
	; times out mid-load. Measured with the real UI assets and a websocket held
	; open, which is what a browser actually does:
	;
	;   lines   dma free   display, idle          two browser tabs
	;      12    12.3 kB   1 slip / 267774        every asset times out
	;      10    14.7 kB   0 slips / 9131         every asset times out
	;       8    18.3 kB   3 slips / 13908        full page load in 3.1 s
	;
	; The threshold between 14.7 and 18.3 kB is sharp, and one tab works at any
	; of these: it takes two (or one reload, which briefly leaves the previous
	; websocket open) to fall over. That is the "it served something and then
	; stopped working" report.
	;
	; Eight is therefore a deliberate trade, not a free win. It costs about one
	; visible slip every two minutes at idle, and the slip log says exactly
	; where those come from: flash_us reads 0xFFFFFFFF (no NVS or LittleFS write
	; is involved at all) and overlay_us reads hundreds of seconds, while
	; band_us reads 67 to 1703 us. Every slip lands within ~2 ms of an animation
	; band push, which is the PSRAM-to-PSRAM copy described above. Fix that copy
	; and this trade goes away: the deadline stops mattering because the traffic
	; it is losing to disappears. Until then, do not raise this back to twelve
	; without re-testing two browser tabs.
	;
	; Since scripts/patch_esp_lcd_rgb.py the driver keeps EIGHT bounce buffers
	; rather than the stock two, so this number is an eighth of the pool, not a
	; half. Two lines x 8 buffers is 15,360 bytes, exactly what eight lines x 2
	; cost before, so the DMA-free figures above still apply and the two-browser-
	; tab cliff is in the same place. Keep lines x buffers at 15,360 bytes.
	;
	; What the split buys is deadline, and only deadline. The pool always holds
	; 16 scanlines, which at a 13.3 MHz pixel clock is 622 us of scan-out. A
	; refill must land before the DMA works its way through every OTHER buffer
	; and wraps back onto the one being filled, so the slack is (N-1)/N of that
	; 622 us: 466 us at four buffers, 544 us at eight. Measured why this matters:
	; the refill copy is bandwidth-bound on octal PSRAM at ~80 MB/s, so its
	; median is ~48 us, but 8.6% of calls run past 128 us and 1.8% past a whole
	; buffer time. Those are what eat the slack, and they are not the rare
	; millisecond stalls, which are only 0.035% of calls.
	;
	; The cost is interrupt rate, which is the reason not to keep splitting.
	; Refills are 480/lines per frame, so two lines is 12,144/s at 50.6 Hz where
	; four was 6,072/s. One line would buy only a further 39 us of slack for
	; another doubling, which is not worth it.
	;
	; Two also keeps each bounce buffer at 1,920 bytes, under the 4,095-byte
	; cap on a single DMA descriptor, so one buffer is still one descriptor.
	-DGM_LCD_BOUNCE_LINES=2
	-DGM_LCD_HSYNC_PW=8
	-DGM_LCD_HSYNC_BP=20
	-DGM_LCD_HSYNC_FP=10
	-DGM_LCD_VSYNC_PW=8
	-DGM_LCD_VSYNC_BP=10
	-DGM_LCD_VSYNC_FP=10

; Demo and test build. The display firmware exactly as shipped, with one
; difference: GM_FAKE_CONTROLLER synthesizes the handshake and feeds synthetic
; telemetry, so the UI leaves "waiting for controller" and every screen can be
; reached with no controller board attached.
;
; Unlike display-bench this deliberately does NOT define GM_ANIM_BENCH, so the
; background animation honours its settings instead of running a measurement
; sweep, bgAnimAllScreens is not forced on, and the resolution and interlacing
; settings are live rather than compiled out. Touch and the web UI behave
; normally.
;
; Still not a shipping target: BLE never starts and the temperature and
; pressure readings are generated, not measured. The system status screen
; reports the controller as "FakeBench" precisely so this is not mistaken for a
; real link.
[env:display-demo]
extends = env:display
build_flags =
	${env:display.build_flags}
	-DGM_FAKE_CONTROLLER=1

; Standalone animation testbench. Fakes the controller handshake so the display
; reaches its normal standby screen with no controller board wired up (the
; background animation refuses to run without a live link), then sweeps the
; whole animation registry, timing each stage of the render pipeline on the
; real panel. Results are served from /api/animbench. Never ship this: it does
; not start BLE and it reports temperatures that are made up.
; Reproduces production's memory and radio load on a bench with no controller
; board: real WiFi, real BLE bring-up, real comms pump, and a synthetic
; SystemInfo so the UI leaves its waiting screen and the background animation
; runs. display-demo cannot do this -- GM_FAKE_CONTROLLER skips BLE, and BLE is
; 44 KB of internal DRAM. Never ship this: the handshake is fabricated.
; The shipping display build plus one bench-only change: hold a BLE connection
; open against whatever peripheral is in range, so a board with no controller
; nearby can still be measured while the link is genuinely UP rather than
; scanning. Scanning is a 5% duty cycle; a connection is not, and that was the
; one load the bench could not otherwise reproduce. Read-only: it connects and
; discovers services, then idles. Never ship this.
; Radio-off bench. GAGGIMATE_NO_RADIO skips setupWifi (BLE still comes up), and
; GM_SCANOUT_SERIAL puts the scan-out counters on the serial log, because with
; no WiFi there is no HTTP to read /api/debug/scanout through. This is what
; identified WiFi as the source of the residual scan-out slips: 0 slips over
; 23,303 frames here, against 5.0 expected from the WiFi-on rate.
[env:display-noradio]
extends = env:display
build_flags =
	${env:display.build_flags}
	-DGAGGIMATE_NO_RADIO=1
	-DGM_SCANOUT_SERIAL=1

; Load rig for the scan-out fault. The shipping display build plus the two
; things a bench with no controller board is missing: BLE brought up and past
; its handshake (GM_SYNTH_HANDSHAKE), and a UI that repaints the way a heating
; machine makes it repaint (the telemetry ramp that flag now drives).
;
; It exists because the garbling the user sees on the machine does not appear
; here at idle: the bench measured 0 slips over 9131 frames while the same
; firmware slipped 10.7% during a real heat-up. Tuning the bounce depth or the
; pixel clock against a bench that reads zero is tuning against nothing.
;
; Never ship this: the handshake and every reading are fabricated.
[env:display-loadtest]
extends = env:display
build_flags =
	${env:display.build_flags}
	-DGM_SYNTH_HANDSHAKE=1
	-DGM_DMA_BALLAST=8192
	; Touch-to-pixel latency probe (GM_TOUCHLAT serial lines, LV_Helper.cpp).
	-DGM_TOUCH_PROBE=1

[env:display-blestress]
extends = env:display
build_flags =
	${env:display.build_flags}
	-DGM_SYNTH_HANDSHAKE=1
	-DGAGGIMATE_HEAP_PROFILE=1
	; Bytes of DMA-capable internal DRAM the rig holds hostage from the moment
	; the radios settle, standing in for what a live controller connection
	; claims and this rig never pays. A configuration that stays clean under
	; ballast has margin; one that does not is merely lucky on a bench.
	-DGM_DMA_BALLAST=8192

[env:display-bench]
extends = env:display
build_flags =
	${env:display.build_flags}
	-DGM_FAKE_CONTROLLER=1
	-DGM_ANIM_BENCH=1

; Runs the display firmware under Espressif's QEMU fork (qemu-system-xtensa,
; -machine esp32s3), so the whole system can be single-stepped, traced and
; instruction-profiled on a desktop with no board attached.
;
; It is the real device build, not the simulator: same board, same IDF, same
; LVGL, same animation code. Three things differ, all forced by what QEMU
; models:
;
;   GAGGIMATE_QEMU        selects src/display/drivers/Qemu (the synthetic RGB
;                         framebuffer device at 0x20000000 / 0x21000000) instead
;                         of probing for a panel over I2C and SPI.
;   GAGGIMATE_NO_RADIO    skips WiFi and the network/BLE plugins. Neither radio
;                         is emulated at all.
;   GM_FAKE_CONTROLLER    synthesizes the controller handshake, so the UI leaves
;                         the "waiting for controller" screen. Replaced by a
;                         second QEMU instance over an emulated UART once the
;                         two-node setup lands.
;
; GAGGIMATE_QEMU_BUILD is a cmake variable rather than a define because it gates
; a link flag (-Wl,--wrap=adc_hal_self_calibration); see src/CMakeLists.txt and
; src/qemu/QemuShims.cpp for why that wrap is unavoidable.
;
; Build a flash image and boot it with scripts/qemu-run.sh.
[env:display-qemu]
extends = env:display
board_build.cmake_extra_args = -DEXECUTABLE_COMPONENT_NAME=src -DSDKCONFIG_DEFAULTS=sdkconfig.common.defaults;sdkconfig.gaggimate.defaults -DGAGGIMATE_QEMU_BUILD=1
build_flags =
	${env:display.build_flags}
	-DGAGGIMATE_QEMU=1
	-DGAGGIMATE_NO_RADIO=1
	-DGM_FAKE_CONTROLLER=1
	; The touch-latency probe's sub-stage counters (GM_UISTAT clear/draw/
	; scan/scrim) double as the offline snapshot-cost attribution channel;
	; see data/qemu-snapshot-profile.md for the method and caveats.
	-DGM_TOUCH_PROBE=1
; GAGGIMATE_NO_RADIO empties HomekitPlugin.cpp, but that is not enough to keep
; the radio down: PlatformIO hands library objects to the linker directly rather
; than as archive members, so HomeSpan.cpp.o is always in the image, and its
; `extern "C" void init()` overrides Arduino's weak startup hook and calls
; WiFi.mode(WIFI_STA) before setup() runs. Under QEMU that reaches phy_init,
; which spins forever on a radio the emulator does not model.
lib_ignore =
	${idf_common.lib_ignore}
	HomeSpan

[env:display-headless]
extends = env:display
board_build.cmake_extra_args = -DEXECUTABLE_COMPONENT_NAME=src -DSDKCONFIG_DEFAULTS=sdkconfig.common.defaults;sdkconfig.gaggimate.defaults -DGAGGIMATE_HEADLESS_BUILD=1
lib_deps = ${display_common.lib_deps_default}
; embed_webui_pre.py is needed here too, not just in env:display. Headless drops
; the panel and the LVGL UI but still builds WebUIPlugin, which serves the web UI
; out of the embedded blob (gWebUiBlobStart, added upstream in #764). The blob
; lives in src/display/webassets/web_ui_blob.S, which this script generates and
; assembles; without it the link fails on an undefined gWebUiBlobStart.
extra_scripts =
	${idf_common.extra_scripts}
	pre:scripts/embed_webui_pre.py
build_flags =
	${display_common.build_flags}
	-DGAGGIMATE_HEADLESS
; Kept only to document intent and to match the other envs. It has no effect:
; PlatformIO prints "the 'src_filter' option cannot be used with ESP-IDF" on every
; build of this project. The selection that actually runs is the
; GAGGIMATE_HEADLESS_BUILD branch in src/CMakeLists.txt, which is also where the
; PanelClock.cpp exception to the drivers/ exclusion lives.
build_src_filter = -<*> +<display/> +<version.h> -<display/drivers/> -<display/ui/> -<display/lv_conf.h> -<display/webassets/>

[env:display-headless-8m]
extends = env:display-headless
board = seeed_xiao_esp32s3
board_build.partitions = partitions/headless_8mb.csv
; sdkconfig.flash8m.defaults comes last so its 8 MB assignment overrides the
; 16 MB one in sdkconfig.gaggimate.defaults (SDKCONFIG_DEFAULTS is applied left
; to right, last assignment wins). Without it this env would build a bootloader
; whose image header claims 16 MB on an 8 MB part.
board_build.cmake_extra_args = -DEXECUTABLE_COMPONENT_NAME=src -DSDKCONFIG_DEFAULTS=sdkconfig.common.defaults;sdkconfig.gaggimate.defaults;sdkconfig.flash8m.defaults -DGAGGIMATE_HEADLESS_BUILD=1

[env:controller]
board = Gaggimate-Controller
board_build.partitions = partitions/controller_8mb.csv
board_build.cmake_extra_args = -DEXECUTABLE_COMPONENT_NAME=src -DSDKCONFIG_DEFAULTS=sdkconfig.common.defaults;sdkconfig.controller.defaults -DGAGGIMATE_CONTROLLER_BUILD=1
build_src_filter = -<*> +<controller/> +<version.h>
custom_nanopb_protos = ${idf_common.custom_nanopb_protos}
custom_nanopb_options = ${idf_common.custom_nanopb_options}
lib_ignore = ${idf_common.lib_ignore}
; Deliberately the same list as every other env. The controller has no
; HomeSpan HAP crypto and so does not need libsodium, but it must not strip it,
; for two reasons that both outlive the controller build:
;
;   1. component_manager.py removes a component by rmtree'ing
;      framework-arduinoespressif32-libs/<mcu>/include/<component> — the SHARED
;      package, not a per-env copy — and never restores it. That damage is
;      permanent for every project using the package until it is reinstalled.
;   2. The remove list is also applied to src/idf_component.yml, which both
;      envs share. libsodium is declared there because the display's HomeSpan
;      needs it (see that file for why the prebuilt Arduino copy is unreachable
;      in a dual-framework build). The manifest is restored from
;      idf_component.yml.orig in a post-build action, so a controller build that
;      fails before that action leaves the declaration stripped and the next
;      display build fails on a missing sodium.h for no visible reason.
;
; The saving was nil either way: nothing in the controller references libsodium,
; so its objects never reach the binary.
custom_component_remove = ${idf_common.custom_component_remove}
extra_scripts = ${idf_common.extra_scripts}
lib_deps =
	GaggiMateController
	FS
	SPIFFS
	ble_ota_dfu
	NanoPbComm
	nanopb/Nanopb@^0.4.9
	bblanchon/ArduinoJson@^7.2.1
build_flags =
	-std=gnu++20
	-DCORE_DEBUG_LEVEL=3
	-DARDUINO_USB_CDC_ON_BOOT=1

; Native-host env for Autotune SIMC unit tests. Autotune.cpp = STL-only, so
; `pio test -e native_autotune` runs host-side, no ESP32/Arduino runtime.
; Unity framework shipped with PlatformIO.
[env:native_autotune]
platform = native
framework =
lib_ldf_mode = off
lib_deps =
	throwtheswitch/Unity@^2.6.0
test_framework = unity
test_filter = test_autotune_simc
; Test TU includes Autotune.cpp directly (see #include at top of
; test_autotune_simc.cpp) — native linker skips NayrodPID's Arduino-dependent
; siblings (SimplePID, SimpleKalmanFilter, ...).
build_unflags =
	-std=gnu++11
build_flags =
	-std=c++17
	-I lib/NayrodPID/src
	-Wno-unused-variable
	-Wno-unused-function

; Desktop simulator: builds the real display firmware natively with the BLE link
; to the controller mocked (sim/comms) and an SDL window as the panel (sim/driver).
; All host shims for Arduino/ESP/FreeRTOS/FS/Preferences/WiFi live in sim/platform.
; Requires SDL2 on the host (macOS: `brew install sdl2`). See sim/README.md. [GM-107]
[env:display-sim]
platform = native
framework =
lib_ldf_mode = off
extra_scripts =
	; Writes the empty web-bundle placeholder when build_webui.sh has not run,
	; so a clean checkout assembles web_ui_blob_sim.S instead of failing on the
	; missing .incbin target.
	pre:scripts/sim_webui_pre.py
	; Generates src/version.h, which WebUIPlugin includes. The device envs get
	; this from [idf_common]; the simulator does not extend that section, so on
	; a tree where no firmware build has run the header simply is not there.
	pre:scripts/auto_firmware_version.py
	; Adds a clickable "Run Simulator" task (pio run -e display-sim -t run).
	post:scripts/sim_run.py
build_src_filter =
	-<*>
	+<display/>
	+<version.h>
	+<../sim/>
	-<display/main.cpp>
	-<display/drivers/>
	-<display/webassets/>
	-<display/plugins/MQTTPlugin.cpp>
	-<display/plugins/HomekitPlugin.cpp>
	-<display/plugins/mDNSPlugin.cpp>
	-<display/plugins/NetworkWatchdogPlugin.cpp>
	-<display/plugins/WifiStaWatchdogPlugin.cpp>
	-<display/plugins/BLEScalePlugin.cpp>
	-<display/plugins/ImprovPlugin.cpp>
lib_deps =
	lvgl/lvgl@8.4.0
	bblanchon/ArduinoJson@^7.2.1
build_unflags =
	-std=gnu++11
build_flags =
	-DGAGGIMATE_SIM
	; The radio gates in Controller.cpp key off this rather than GAGGIMATE_SIM,
	; so the QEMU env can share them without also dropping the background
	; animations (which GAGGIMATE_SIM does exclude).
	-DGAGGIMATE_NO_RADIO
	-std=gnu++17
	-DLV_CONF_INCLUDE_SIMPLE
	-DLV_CONF_PATH="${platformio.src_dir}/display/lv_conf.h"
	-DLV_CONF_SUPPRESS_DEFINE_CHECK
	-DDISABLE_ALL_LIBRARY_WARNINGS
	-DCORE_DEBUG_LEVEL=0
	; Make ArduinoJson auto-configure exactly as on the device (Arduino String,
	; no std::string) so its overload resolution matches the firmware.
	-DARDUINO=10812
	; Path to the embedded WebUI blob, .incbin'd by sim/web/web_ui_blob_sim.S.
	-DGM_WEB_UI_BIN=\"${PROJECT_DIR}/src/display/webassets/web_ui.bin\"
	-I ${PROJECT_DIR}/sim/platform
	-I ${PROJECT_DIR}/sim/platform/arduino
	-I ${PROJECT_DIR}/sim/comms
	-I ${PROJECT_DIR}/sim/driver
	-I ${PROJECT_DIR}/sim/web
	-I ${PROJECT_DIR}/src
	!sdl2-config --cflags
	!sdl2-config --libs
