# The device fetches OTA straight from GitHub releases: WebUIPlugin's
# RELEASE_URL + "tag/nightly", then version.txt and the .bin assets from the
# matching download URL. So a branch that never runs this workflow has a
# nightly channel that 404s on the machine. This fork develops on idf5, so
# idf5 publishes nightlies too.
on:
  push:
    branches:
      - "master"
      - "idf5"

permissions:
  contents: write
name: Build Nightly

# Every run of this workflow deletes and recreates the same `nightly` tag and
# republishes the same release. Two runs in flight interleave those steps, and
# the device reads the tag and the assets separately, so it can end up flashing
# a binary that is not what the tag points at. Queued rather than cancelled:
# a cancelled run can have deleted the tag without republishing, which leaves
# the OTA channel returning 404 until the next one finishes.
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-tags: true
          fetch-depth: 0
          submodules: 'recursive'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Add version
        run: |
          mkdir -p out
          mkdir -p upload/display
          mkdir -p upload/headless
          mkdir -p upload/controller
          # Both are moving tags that would otherwise win `git describe` and
          # make the version string self-referential. `|| true` because a fork
          # that has never published one of them does not have the tag to
          # delete, and a bare `git tag -d` failure would kill the whole job.
          git tag -d nightly || true
          git tag -d db || true
          git describe --tags --dirty > out/version.txt
      # The update server is upstream's own distribution channel and its
      # credentials are repository secrets. A fork does not have them, and the
      # composite action ends in `curl --fail-with-body` against an empty host,
      # so every upload step failed the job -- which meant `release-nightly`
      # (needs: build) never ran and no GitHub release was published either.
      # That is the actual reason the nightly channel 404s here. Detect once
      # and skip the uploads; the GitHub release is what the firmware reads.
      - name: Detect update server credentials
        id: update_server
        env:
          UPDATE_SERVER_HOST: ${{ secrets.UPDATE_SERVER_HOST }}
          UPDATE_SERVER_API_KEY: ${{ secrets.UPDATE_SERVER_API_KEY }}
        run: |
          if [[ -n "${UPDATE_SERVER_HOST}" && -n "${UPDATE_SERVER_API_KEY}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No update-server credentials; skipping those uploads. The GitHub nightly release is still published and is what devices fetch."
          fi
      - name: Build Web
        run: ./scripts/build_webui.sh
      - name: Build controller
        run: |
          export PLATFORMIO_BUILD_FLAGS="'-DNIGHTLY_BUILD'"
          pio run -e controller
          cp .pio/build/controller/firmware.bin out/board-firmware.bin
          cp .pio/build/controller/partitions.bin out/board-partitions.bin
          cp .pio/build/controller/bootloader.bin out/board-bootloader.bin
          cp .pio/build/controller/firmware.bin upload/controller/firmware.bin
          cp .pio/build/controller/partitions.bin upload/controller/partitions.bin
          cp .pio/build/controller/bootloader.bin upload/controller/bootloader.bin
      - uses: ./.github/actions/upload-firmware
        if: steps.update_server.outputs.configured == 'true'
        env:
          UPDATE_SERVER_HOST: ${{ secrets.UPDATE_SERVER_HOST }}
          UPDATE_SERVER_API_KEY: ${{ secrets.UPDATE_SERVER_API_KEY }}
        with:
          channel: 'nightly'
          target: 'controller'
          firmware_dir: 'upload/controller'
      - name: Build display FS
        run: |
          pio run -t buildfs -e display
          cp .pio/build/display/littlefs.bin upload/display/filesystem.bin
          cp .pio/build/display/littlefs.bin upload/headless/filesystem.bin
          cp .pio/build/display/littlefs.bin out/display-filesystem.bin
          cp .pio/build/display/littlefs.bin out/display-headless-filesystem.bin
      - name: Build display
        run: |
          export PLATFORMIO_BUILD_FLAGS="'-DNIGHTLY_BUILD'"
          pio run -e display
          cp .pio/build/display/firmware.bin out/display-firmware.bin
          cp .pio/build/display/partitions.bin out/display-partitions.bin
          cp .pio/build/display/bootloader.bin out/display-bootloader.bin
          cp .pio/build/display/firmware.bin upload/display/firmware.bin
          cp .pio/build/display/partitions.bin upload/display/partitions.bin
          cp .pio/build/display/bootloader.bin upload/display/bootloader.bin
      - uses: ./.github/actions/upload-firmware
        if: steps.update_server.outputs.configured == 'true'
        env:
          UPDATE_SERVER_HOST: ${{ secrets.UPDATE_SERVER_HOST }}
          UPDATE_SERVER_API_KEY: ${{ secrets.UPDATE_SERVER_API_KEY }}
        with:
          channel: 'nightly'
          target: 'display'
          firmware_dir: 'upload/display'
          firmware_files: 'bootloader.bin,partitions.bin,firmware.bin,filesystem.bin'
      - name: Build headless
        run: |
          export PLATFORMIO_BUILD_FLAGS="'-DNIGHTLY_BUILD'"
          pio run -e display-headless
          cp .pio/build/display-headless/firmware.bin out/display-headless-firmware.bin
          cp .pio/build/display-headless/partitions.bin out/display-headless-partitions.bin
          cp .pio/build/display-headless/bootloader.bin out/display-headless-bootloader.bin
          cp .pio/build/display-headless/firmware.bin upload/headless/firmware.bin
          cp .pio/build/display-headless/partitions.bin upload/headless/partitions.bin
          cp .pio/build/display-headless/bootloader.bin upload/headless/bootloader.bin
      - uses: ./.github/actions/upload-firmware
        if: steps.update_server.outputs.configured == 'true'
        env:
          UPDATE_SERVER_HOST: ${{ secrets.UPDATE_SERVER_HOST }}
          UPDATE_SERVER_API_KEY: ${{ secrets.UPDATE_SERVER_API_KEY }}
        with:
          channel: 'nightly'
          target: 'headless'
          firmware_dir: 'upload/headless'
          firmware_files: 'bootloader.bin,partitions.bin,firmware.bin,filesystem.bin'
      - name: Archive Firmware Files
        uses: actions/upload-artifact@v4
        with:
          name: gaggimate-firmware
          path: "out/*"
  release-nightly:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      pull-requests: write
    steps:
      - name: Download Firmware Files
        uses: actions/download-artifact@v4
        with:
          name: gaggimate-firmware
          path: release
      # The device resolves .../releases/tag/nightly and then pulls version.txt
      # and the .bin assets from that release, so the tag has to end up on the
      # commit these binaries were built from. A single PATCH on the ref moves
      # it atomically; the fallback POST covers the case where the tag does not
      # exist yet. Deliberately not delete-then-recreate: that leaves a window
      # where the OTA channel 404s.
      - name: Move the nightly tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          gh api -X PATCH "repos/$REPO/git/refs/tags/nightly" -f sha="$SHA" -F force=true ||
            gh api -X POST "repos/$REPO/git/refs" -f ref=refs/tags/nightly -f sha="$SHA"
      # Was andelf/nightly-release, which failed here with "Resource not
      # accessible by integration" even though this job's token is logged as
      # holding Contents: write. ncipollo/release-action is what build.yml has
      # been publishing tagged releases with on this repo all along, at this
      # same pinned SHA, so switching to it removes a variable instead of
      # adding one. removeArtifacts clears the previous nightly's binaries,
      # which would otherwise accumulate under the same tag.
      - name: Update Nightly Release
        uses: ncipollo/release-action@bcfe5470707e8832e12347755757cec0eb3c22af
        with:
          tag: nightly
          commit: ${{ github.sha }}
          name: 'Nightly Release'
          prerelease: true
          makeLatest: false
          allowUpdates: true
          removeArtifacts: true
          artifacts: 'release/*'
          body: 'Latest nightly release, use the nightly channel in the UI to download this firmware.'
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy to GitHub Pages subdirectory
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./release
          destination_dir: nightly
          publish_branch: gh-pages
