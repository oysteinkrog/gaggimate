# Push/PR gate.
#
# Until this branch, nothing that ran on a push actually compiled the firmware:
# static analysis skipped codegen, the nightly workflow was master-only and the
# release workflow was tag-only, so a change that broke the build stayed green
# until someone cut a tag. The `build` and `test` jobs below close that.
on: [push, pull_request]

jobs:
  analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          submodules: 'recursive'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio
      # Only the generated EEZ Studio tree is excluded now. A full run over
      # src/display/ui reports 0 high and 0 medium; of the 1805 low findings,
      # 1747 are in eez/ (unreadVariable, variableScope, arrayIndexThenCheck in
      # machine-written code nobody will edit by hand), so excluding that subtree
      # buys the whole reduction and the rest of the UI is clean.
      #
      # Still non-blocking while the -D__extension__= fix in platformio.ini is
      # confirmed on the runner. What kept this step red had nothing to do with
      # the code: cppcheck 2.11 cannot parse GCC 14.2's <type_traits>:788, hit a
      # syntaxError inside PlatformIO's packages directory, and PlatformIO treats
      # a breaking defect there as a failed run whatever the findings are.
      - name: Run static code analysis for display
        continue-on-error: true
        run: platformio check -e display --fail-on-defect=medium -f "-<*>" -f "+<src/display/>" -f "-<src/display/ui/default/eez>"
      - name: Run static code analysis for controller
        run: platformio check -e controller --fail-on-defect=medium -f "-<*>" -f "+<src/controller/>"

  build:
    name: Build firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-tags: true
          fetch-depth: 0
          submodules: 'recursive'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      # The same order build.yml uses. The web bundle is built first because
      # the display image embeds it; without this the pre-build hook silently
      # substitutes an empty stub and a broken UI build would go unnoticed.
      - name: Build Web
        run: ./scripts/build_webui.sh
      - name: Build controller
        run: pio run -e controller
      - name: Build display
        run: pio run -e display
      - name: Build display filesystem
        run: pio run -t buildfs -e display
      # Headless has its own source selection in src/CMakeLists.txt, so it can
      # break on a change that leaves the two release targets compiling.
      - name: Build display-headless
        run: pio run -e display-headless
      # No workflow built this one: build.yml ships controller + display, the
      # nightly adds display-headless, and display-headless-8m was left to
      # whoever happened to run it locally. It has its own defaults chain
      # (flash8m.defaults after gaggimate.defaults, which unsets the 16 MB flash
      # size) and its own partition table, so it is the env most able to break
      # while the other three stay green.
      - name: Build display-headless-8m
        run: pio run -e display-headless-8m

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          submodules: 'recursive'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-native
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio
      # Host-side SIMC autotune tests. No workflow ran these before.
      - name: Run autotune unit tests
        run: pio test -e native_autotune

  animations:
    name: Animation goldens
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          submodules: 'recursive'
      # The background animations carry two host-checkable invariants that
      # nothing ran automatically: 39 golden frames across the 13 animations,
      # and band() producing the same row whatever strip height it is called
      # with -- the property SleepAnimation's interlaced half-res path depends
      # on, and one that a caching optimization can break while leaving the
      # golden frames bit-exact. Both are plain g++ and a few seconds; there is
      # no reason for them to be a thing someone remembers to run.
      - name: Golden frames and band call-shape invariance
        run: make -C tools/animbench check
