# Push/PR gate.
#
# Until this branch, nothing that ran on a push actually compiled the firmware:
# static analysis skipped codegen, the nightly workflow was master-only and the
# release workflow was tag-only, so a change that broke the build stayed green
# until someone cut a tag. The `build` and `test` jobs below close that.
on: [push, pull_request]

name: Checks

# Nothing here publishes anything, so a superseded push has no reason to keep
# five jobs on the runners.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          submodules: 'recursive'
      # The cache key hashes the files that decide what PlatformIO fetches.
      # A constant key restored the first cache ever saved and never saved
      # another one (actions/cache skips the save on an exact key hit).
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'sdkconfig*.defaults') }}
          restore-keys: ${{ runner.os }}-pio-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # PlatformIO is pinned to 6.1.19, the one core this project is built
      # with (CLAUDE.md). check_skip_packages in platformio.ini depends on the
      # cppcheck that 6.1.19 bundles, and the -O2 override depends on its
      # flag order, so a newer core can turn these checks red, or the
      # override silently inert, with no source change. Every workflow pins
      # the same version; change them together.
      - name: Install PlatformIO Core
        run: pip install "platformio==6.1.19"
      # Only the generated EEZ Studio tree is excluded. A full run over
      # src/display/ui reports 1 high, 15 medium and 2110 low, and eez/ owns
      # 1/15/2107 of that: the high and every medium are in eez-flow.cpp, the
      # vendored flow-engine runtime, and would come straight back the next
      # time EEZ Studio regenerates it. Everything we actually write is 0/0/3.
      #
      # Both steps block now. The display step used to be pinned to
      # continue-on-error for a reason that had nothing to do with this code:
      # cppcheck 2.11 could not parse GCC 14.2's libstdc++, so every translation
      # unit died in a package header and PlatformIO reported the run as failed
      # whatever the findings were. check_skip_packages in platformio.ini fixes
      # that; the comment there has the detail.
      #
      # --fail-on-defect is an exact severity match, not a threshold: a single
      # =medium would let a HIGH defect through silently. Both severities have
      # to be listed. A clean run today is 0 high, 0 medium, 43 low on display
      # and 0/0/8 on controller, so low stays out of the gate for now.
      - name: Run static code analysis for display
        run: platformio check -e display --fail-on-defect=high --fail-on-defect=medium -f "-<*>" -f "+<src/display/>" -f "-<src/display/ui/default/eez>"
      - name: Run static code analysis for controller
        run: platformio check -e controller --fail-on-defect=high --fail-on-defect=medium -f "-<*>" -f "+<src/controller/>"

  build:
    name: Build firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-tags: true
          fetch-depth: 0
          submodules: 'recursive'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'sdkconfig*.defaults') }}
          restore-keys: ${{ runner.os }}-pio-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core
        run: pip install "platformio==6.1.19"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      # The same order build.yml uses. The web bundle is built first because
      # the display image embeds it; without this the pre-build hook silently
      # substitutes an empty stub and a broken UI build would go unnoticed.
      - name: Build Web
        run: ./scripts/build_webui.sh
      # The web tree has carried an eslint config and a lint:check script the
      # whole time and no workflow ran either, so a JS error only showed up as
      # a broken page on a device. It runs here because build_webui.sh has
      # already done npm ci; the tree is clean today at 0 errors and 7
      # warnings, and only errors fail the step.
      - name: Lint Web
        run: npm --prefix web run lint:check
      - name: Build controller
        run: pio run -e controller
      - name: Build display
        run: pio run -e display
      - name: Build display filesystem
        run: pio run -t buildfs -e display
      # Headless has its own source selection in src/CMakeLists.txt, so it can
      # break on a change that leaves the two release targets compiling.
      - name: Build display-headless
        run: pio run -e display-headless
      # No workflow built this one: build.yml ships controller + display, the
      # nightly adds display-headless, and display-headless-8m was left to
      # whoever happened to run it locally. It has its own defaults chain
      # (flash8m.defaults after gaggimate.defaults, which unsets the 16 MB flash
      # size) and its own partition table, so it is the env most able to break
      # while the other three stay green.
      - name: Build display-headless-8m
        run: pio run -e display-headless-8m
      # display-bench and display-demo are the last two envs no workflow
      # touches. Both extend env:display and only add defines, and bench's set
      # is a strict superset of demo's (GM_FAKE_CONTROLLER plus GM_ANIM_BENCH,
      # every guard on either is a plain #ifdef), so this one build compiles
      # both. It is worth having: GM_ANIM_BENCH alone gates roughly 500 lines
      # across WebUIPlugin, SleepAnimation and DefaultUI that nothing else
      # compiles, which is exactly how display-sim rotted.
      - name: Build display-bench
        run: pio run -e display-bench
      # The two envs the bench depends on (gm-bzu.36). display-loadtest
      # compiles GM_TOUCH_PROBE, GM_SYNTH_HANDSHAKE and GM_DMA_BALLAST: the
      # touch probe, /api/debug/tap and the settings debug routes the device
      # runner needs. display-kdev compiles GM_KBLOB (SleepAnimationKBlob.cpp
      # and KBlob.cpp) with its own sdkconfig chain. Neither was built by any
      # workflow, and the gm-bzu.19 hook move broke the flag builds' link
      # without anything going red. Each also runs the build guard
      # (scripts/assert_sdkconfig.py) against its own chain.
      - name: Build display-loadtest
        run: pio run -e display-loadtest
      - name: Build display-kdev
        run: pio run -e display-kdev

  simulator:
    name: Build simulator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          # auto_firmware_version.py runs git describe, so the tags have to be
          # here or the simulator reports an empty version string.
          fetch-tags: true
          fetch-depth: 0
          submodules: 'recursive'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-native-${{ hashFiles('platformio.ini', 'sdkconfig*.defaults') }}
          restore-keys: ${{ runner.os }}-pio-native-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core
        run: pip install "platformio==6.1.19"
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      # display-sim compiles the real display sources against the host shims in
      # sim/, so it is the only target that catches a missing include or a use
      # of something the shims do not provide. Nothing ever built it in CI and
      # it had rotted through: seven separate breakages, from a header the host
      # cannot compile at all to production calls added since the shims were
      # last touched. It only links, it is never run -- there is no display on
      # the runner, and the value here is the compile, not the window.
      - name: Build display-sim
        run: pio run -e display-sim
      # Boot smoke test. SDL's dummy video driver gives the panel somewhere to
      # push pixels without a display, so the whole startup path runs for real:
      # LVGL init, the mock BLE link, the web server. A crash in setup() exits
      # before the timeout fires, which is why the success condition is "timeout
      # had to kill it" (124) plus the line the web server prints once it is up.
      - name: Boot the simulator
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          set +e
          timeout 20 .pio/build/display-sim/program > sim-boot.log 2>&1
          rc=$?
          set -e
          cat sim-boot.log
          if [[ $rc -ne 124 ]]; then
            echo "::error::simulator exited early (rc=$rc) instead of running until the timeout"
            exit 1
          fi
          grep -q "Started webserver" sim-boot.log

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      # .clang-format and scripts/format.sh have both been in the tree since
      # before this branch, CONTRIBUTING points at them, and nothing ever
      # checked them: 27 of the 207 in-scope files had drifted, one of them
      # indented two spaces in a four-space project.
      #
      # The version is pinned. clang-format output is not stable across major
      # versions, so taking whatever the runner happens to ship would fail this
      # gate on a runner-image bump with no source change. 14 is the version
      # the tree is formatted with.
      #
      # Note for anyone chasing a failure here: clang-format 14 is not
      # idempotent on HardwareScale.cpp. It miscounts the display width of the
      # U+26A0 emoji in an ESP_LOGW string, so the first -i pass breaks the line
      # one way and the second corrects it. Run scripts/format.sh twice if a
      # single run leaves --check unhappy.
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-14
      - name: Check formatting
        env:
          CLANG_FORMAT: clang-format-14
        run: ./scripts/format.sh --check

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          submodules: 'recursive'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-native-${{ hashFiles('platformio.ini', 'sdkconfig*.defaults') }}
          restore-keys: ${{ runner.os }}-pio-native-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core
        run: pip install "platformio==6.1.19"
      # One step per native_* env in platformio.ini. A new native env needs
      # a step here too, or it never runs.
      #
      # Host-side SIMC autotune tests. No workflow ran these before.
      - name: Run autotune unit tests
        run: pio test -e native_autotune
      # The on-display settings value model: ranges, steps, wrap, formats,
      # the zone split, the gradient map and schedule parsing.
      - name: Run settings model unit tests
        run: pio test -e native_settingsui
      # The env's test_filter names only test_ota_result, so the vendored
      # semver test (gm-bzu.57: a prerelease ranks below its release, which
      # is what keeps OTA from offering an rc as an update over the release)
      # has to be named here as well. -f on the command line replaces the
      # ini filter, so both are listed.
      - name: Run OTA result and semver unit tests
        run: pio test -e native_otaresult -f test_ota_result -f test_semver_prerelease
      # The build guard's own test (gm-bzu.29): scripts/assert_sdkconfig.py
      # run against the tracked sdkconfigs, which must pass, and against
      # copies with one forbidden line injected each, which must fail. Plain
      # Python, no PlatformIO.
      - name: Build guard host test
        run: python tools/sdkconfig_guard_test.py

  animations:
    name: Animation goldens
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          submodules: 'recursive'
      # The background animations carry two host-checkable invariants that
      # nothing ran automatically: 39 golden frames across the 13 animations,
      # and band() producing the same row whatever strip height it is called
      # with -- the property SleepAnimation's interlaced half-res path depends
      # on, and one that a caching optimization can break while leaving the
      # golden frames bit-exact. Both are plain g++ and a few seconds; there is
      # no reason for them to be a thing someone remembers to run.
      - name: Golden frames and band call-shape invariance
        run: make -C tools/animbench check
      # Lifecycle under the sanitizers (gm-bzu.15): every animation through
      # init, render and release at 480, 240, 466 and 233, with the heap made
      # to run out at each allocation in turn. The goldens above init once
      # and never release, so a table sized from a stale width, a hot table
      # leaked across a size switch, or an init() that returns true with a
      # null table after a partial failure only shows here. halt_on_error
      # turns the first sanitizer report into a failing step.
      - name: Animation lifecycle and allocation faults
        run: make -C tools/animbench -f Makefile.lifecycle check
      # The steps below build with ASan and UBSan. UBSan only reports and
      # carries on by default, so halt_on_error is what makes a report fail
      # the step; ASan already aborts on its first error.
      #
      # Parameter and time sweep of every animation under the sanitizers
      # (tools/animbench/fuzz.cpp): each band in its own exactly sized heap
      # block, every parameter at both ends, millis() up to the wrap. About
      # 85k bands and a few seconds. Without the sanitizers it is not a
      # fuzzer, which is why it runs as built by Makefile.fuzz.
      - name: Animation fuzz
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          make -C tools/animbench -f Makefile.fuzz
          tools/animbench/build/fuzz
      # The dial ring compositor element (gm-2cl.6): the real
      # TickRingElement.cpp against a reference of LVGL's masked fill plus
      # the overlay blend, under ASan and UBSan.
      - name: Tick ring element
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make -C tools/tickringbench check
      # Overlay pipeline kernels (span scan, scrim build, overlay blend,
      # half-res expand) against their goldens.
      - name: Overlay kernel goldens
        run: make -C tools/overlaybench check
      # Palette builds under concurrent theme publishes (gm-bzu.71).
      - name: Theme publication
        run: make -C tools/animbench -f Makefile.theme check
      # Each QEMU test's hand-copied asm kernel against the asm block it
      # claims to transcribe in src/ (gm-bzu.35). Plain Python, so it runs
      # here. Building and running those tests under QEMU is left out: that
      # needs the Xtensa toolchain and Espressif's QEMU, which the runner
      # does not have (tools/qemubench/README.md).
      - name: QEMU kernel copies match src
        run: python3 tools/qemubench/check_copies.py
